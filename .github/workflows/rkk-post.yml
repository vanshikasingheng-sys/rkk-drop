name: RKK auto reel
on:
  schedule:
    # 3 slots a day (UTC). Each scheduled run also waits a random 0-80 min, so post times vary.
    - cron: "17 4 * * *"    # ~10:00-11:20 IST
    - cron: "41 10 * * *"   # ~16:10-17:30 IST
    - cron: "23 15 * * *"   # ~20:50-22:10 IST
  workflow_dispatch:
    inputs:
      reel_id: {description: "Build a specific reel id (optional)", required: false, default: ""}
      dry_run: {description: "Only build (no posting)", type: boolean, default: false}
permissions:
  contents: write
concurrency: {group: rkk-post, cancel-in-progress: false}
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Random wait
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 4800 ))
      - name: Setup
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji > /dev/null
          pip install -q numpy playwright
          python -m playwright install --with-deps chromium > /dev/null
      - name: Build next reel
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          git pull -q || true
          if [ -n "${{ inputs.reel_id }}" ]; then python pipeline/run_next.py build --id "${{ inputs.reel_id }}"; else python pipeline/run_next.py build; fi
      - name: Publish video file (media branch)
        if: hashFiles('work/ready.json') != ''
        run: |
          NAME=$(python -c "import json;print(json.load(open('work/ready.json'))['name'])")
          FINAL=$(python -c "import json;print(json.load(open('work/ready.json'))['final'])")
          mkdir -p /tmp/media && cp "$FINAL" "/tmp/media/$NAME" && cd /tmp/media
          git init -q && git checkout -q -b media && git add . 
          git -c user.name=rkk-bot -c user.email=rkk-bot@users.noreply.github.com commit -qm "video $NAME"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" media
          sleep 25
      - name: Post (YouTube + Instagram + Facebook via Make)
        if: hashFiles('work/ready.json') != '' && inputs.dry_run != true
        env:
          MAKE_WEBHOOK: ${{ secrets.MAKE_WEBHOOK }}
        run: python pipeline/run_next.py post
      - name: Save state
        if: always()
        run: |
          git config user.name "rkk-bot"; git config user.email "rkk-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -qm "state: posted reel" && git pull -q --rebase && git push -q)
      - name: Keep the built video (download from the run page)
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: reel, path: work/*/final.mp4, retention-days: 5, if-no-files-found: ignore}
